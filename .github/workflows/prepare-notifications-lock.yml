name: Prepare notifications lockfile
on:
  push:
    branches: [maintenance/notifications-lock-20261016]
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Prepare package for the offline workspace
        run: |
          mkdir -p .maintenance
          npm pack expo-notifications@0.32.17 --pack-destination /tmp
          base64 -w 0 /tmp/expo-notifications-0.32.17.tgz > .maintenance/expo-notifications.tgz.base64
      - name: Save generated lockfile
        run: |
          git add pnpm-lock.yaml .maintenance/expo-notifications.tgz.base64
          if ! git diff --cached --quiet; then
            git -c user.name="Brushlings build" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Lock Expo local notifications dependency"
            git push origin HEAD:maintenance/notifications-lock-20261016
          fi
