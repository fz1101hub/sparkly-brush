name: Verify

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"

env:
  CI: "1"
  EXPO_NO_TELEMETRY: "1"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript
        run: pnpm check

      - name: Tests
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Security audit (critical gate)
        run: pnpm audit --prod --audit-level critical

      - name: Expo Doctor
        run: pnpm exec expo-doctor

      - name: Bundle web
        run: pnpm exec expo export --platform web --output-dir /tmp/sparkly-web

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify theme UI
        env:
          BRUSHLINGS_TEST_BUILD_DIR: /tmp/sparkly-web
        run: pnpm test:ui

      - name: Upload theme review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: theme-review
          path: test-results/themes
          if-no-files-found: ignore

      - name: Bundle iOS
        run: pnpm exec expo export --platform ios --output-dir /tmp/sparkly-ios

      - name: Bundle Android
        run: pnpm exec expo export --platform android --output-dir /tmp/sparkly-android

  native-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Android project
        run: pnpm exec expo prebuild --platform android --clean --no-install

      - name: Compile Android debug app
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

  native-ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate iOS project
        run: pnpm exec expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Compile iOS simulator app
        run: |
          WORKSPACE=$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath /tmp/sparkly-derived-data \
            CODE_SIGNING_ALLOWED=NO \
            build

